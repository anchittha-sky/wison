name: update-water
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch water levels
        run: python fetch_water.py
      - name: Fetch rain gauges
        continue-on-error: true
        run: python fetch_rain.py
      - name: Commit result
        run: |
          git config user.name "water-bot"
          git config user.email "water-bot@users.noreply.github.com"
          git add water.json rain_stations.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
